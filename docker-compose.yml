# version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: selforder
      POSTGRES_PASSWORD: selforder
      POSTGRES_DB: selforder
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://selforder:selforder@db:5432/selforder
    depends_on: [db]
    ports: ["8000:8000"]
    working_dir: /app
    volumes:
      - ./:/app            # <-- monta todo el repo dentro del contenedor
    command: bash -lc "poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
volumes:
  pgdata:
