name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps (for lint/type-check on host)
        run: poetry install

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Mypy (type-check)
        run: poetry run mypy .

      - name: Copy env file
        run: cp .env.example .env

      # 👉 Aquí levantamos DB + API (usa tu docker-compose.yml)
      - name: Start services (db + api)
        run: docker compose up -d db api

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U ${POSTGRES_USER:-postgres} && break
            sleep 1
          done

      - name: Run Alembic migrations
        run: docker compose exec -T api poetry run alembic upgrade head

      - name: Pytest (inside container)
        run: docker compose exec -T api poetry run pytest -q
