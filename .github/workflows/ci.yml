name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Copiar .env de ejemplo para Docker Compose
      - name: Copy env file
        run: cp .env.example .env

      # Lint y type-check en el host (rápido, falla antes de levantar Docker)
      - name: Install Poetry
        run: pip install poetry

      - name: Install deps (for lint/type-check on host)
        run: poetry install

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Mypy (type-check)
        run: poetry run mypy .

      # ---------- Docker ----------
      # 1) Levanta SOLO la DB
      - name: Start Postgres
        run: docker compose up -d db

      # 2) Espera a que Postgres esté listo
      - name: Wait for Postgres
        run: |
          for i in {1..40}; do
            docker compose exec -T db pg_isready -U ${POSTGRES_USER:-postgres} && exit 0
            sleep 1
          done
          echo "Postgres no respondió a tiempo" >&2
          docker compose logs db --tail=200
          exit 1

      # 3) Migraciones en contenedor efímero (no depende de que 'api' esté arrancado)
      - name: Run Alembic migrations (one-off)
        run: docker compose run --rm api poetry run alembic upgrade head

      # 4) Tests en contenedor efímero
      - name: Run tests (one-off)
        run: docker compose run --rm api poetry run pytest -q || (docker compose logs api && exit 1)

      # 5) Logs útiles si algo falla
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs db --tail=200 || true
          docker compose logs api --tail=200 || true
