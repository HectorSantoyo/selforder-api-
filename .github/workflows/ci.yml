name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry (pip)
        run: pip install poetry==1.8.3

      - name: Configure Poetry (no venv)
        run: poetry config virtualenvs.create false

      - name: Install deps (with dev)
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        run: pytest -q

  docker-build:
    name: Docker build (sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t selforder-api:ci .
